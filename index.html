<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Job Application Form</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        const stored = localStorage.getItem("job-application-form-theme"); // keep in sync with STORAGE_KEY in constants.ts
        const isDark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", isDark);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
